services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-toro}
      MYSQL_USER: ${MYSQL_USER:-toro}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-toro}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-toro}
      DB_USERNAME: ${MYSQL_USER:-toro}
      DB_PASSWORD: ${MYSQL_PASSWORD:-toro}
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-me-32-chars-min}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "file_get_contents('http://127.0.0.1:8080/health');"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  mysql_data:
